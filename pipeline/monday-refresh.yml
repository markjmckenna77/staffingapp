# Monday staffing dashboard refresh - replaces the Claude scheduled task.
#
# Every Monday at 3:00 AM Pacific (Mark, Oct 20 2026 - was 7 AM): pull Snowflake + Greenhouse
# (the Friday "Greenhouse Report: Recruiting report" email means Jill's updates are in by then),
# build the page, check it, archive last week's Meeting Agenda and upload the page to the app
# (POST /api/dashboard).
# No redeploy: the app serves the uploaded page straight from its database.
#
# A failed check or a failed upload leaves last week's page live and fails the run, and
# GitHub emails the repo owner. The run's Summary tab shows the headline numbers and
# anything that needs a look.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SNOWFLAKE_ACCOUNT  SNOWFLAKE_USER  SNOWFLAKE_ROLE  SNOWFLAKE_WAREHOUSE  SNOWFLAKE_PRIVATE_KEY
#   APP_URL            IMPORT_TOKEN
name: Monday staffing refresh

on:
  schedule:
    # GitHub cron is UTC-only and often late at the top of the hour. Both fire every Monday at
    # :07; the "Pick the 3 AM run" step lets through the one that lands in the 3 AM Pacific hour
    # (10:07 UTC in PDT, 11:07 in PST), or the later one if the 3 AM run never succeeded.
    - cron: "7 10 * * 1"
    - cron: "7 11 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the page and archive the agenda (unticked = build and check only)"
        type: boolean
        default: false
      date:
        description: "Build as of this date, YYYY-MM-DD (blank = today)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read      # to fetch last week's state artifact

concurrency:
  group: monday-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick the 3 AM run
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "$hour" -lt 3 ]; then
            echo "It is $hour:xx in Los Angeles - the other trigger is the 3 AM one. Skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$hour" -eq 3 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 4 AM or later: a fallback - run only if no refresh has succeeded today
          done_today=$(gh run list -R "$REPO" --workflow monday-refresh.yml --status success --event schedule \
                         --created ">=$(date -u +%F)" --json databaseId -q 'length')
          if [ "${done_today:-0}" -gt 0 ]; then
            echo "Already refreshed today - skipping."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful refresh yet today - running as the fallback."; echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Fetch last week's state
        if: steps.gate.outputs.go == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pipeline/state
          # newest successful run of this workflow that published (only those upload "pipeline-state")
          for id in $(gh run list --workflow monday-refresh.yml --status success --limit 15 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name pipeline-state --dir pipeline/state 2>/dev/null; then echo "state from run $id"; break; fi
          done
          ls -la pipeline/state || true

      - name: Build, check and publish
        if: steps.gate.outputs.go == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
          EVENT: ${{ github.event_name }}
          IN_PUBLISH: ${{ inputs.publish }}
          IN_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          args=()
          if [ "$EVENT" = "schedule" ]; then args+=(--publish --archive); fi
          if [ "$IN_PUBLISH" = "true" ]; then args+=(--publish); fi
          if [ -n "$IN_DATE" ]; then args+=(--date "$IN_DATE"); fi
          python pipeline/run.py "${args[@]}"

      - name: Keep the page and log (90 days)
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: |
            pipeline/out/dashboard_*.html
            pipeline/out/summary.md
            pipeline/out/build.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Save state for next week
        if: success() && steps.gate.outputs.go == 'true' && hashFiles('pipeline/out/state/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: pipeline/out/state/
          retention-days: 90
